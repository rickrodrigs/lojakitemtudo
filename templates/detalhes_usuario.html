<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datalhar usuario</title>
</head>
<body>
    <h1>Buscar Usuário</h1>

    <form action="{{ url_for('buscausuario') }}" method="POST">

        <label for="id">ID do usuário:</label>

        <input type="number" id="id" name="id" required>

        <button type="submit">Buscar</button>

    </form>

    {% if usuario %}

        <hr>

        <h2>Usuário encontrado</h2>

        <p><strong>ID:</strong> {{ usuario.id }}</p>
        <p><strong>Username:</strong> {{ usuario.nome }}</p>
        <p><strong>Email:</strong> {{ usuario.email }}</p>
        <p><strong>Endereço:</strong> {{ usuario.end }}</p>

        <a href="{{ url_for('editarusuario', id=usuario.id) }}">
            Editar usuário
        </a>

    {% endif %}

    <br>
    <br>

    <a href="{{ url_for('usuario') }}">Voltar</a>
    
</body>
</html>
