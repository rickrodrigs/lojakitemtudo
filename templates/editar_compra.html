<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>editar compra</title>
</head>
<body>
    {% extends "base.html" %}

{% block titulo %}Editar Compra{% endblock %}

{% block conteudo %}

<h1>Editar Compra</h1>

<form action="{{ url_for('editar_compra', id=compra.id) }}" method="post">

    <p>
        <label for="usuario_id">Usuário:</label>
    </p>

    <select id="usuario_id" name="usuario_id" required>

        {% for usuario in usuarios %}

        <option
            value="{{ usuario.id }}"
            {% if usuario.id == compra.usuario_id %}selected{% endif %}
        >
            {{ usuario.nome }}
        </option>

        {% endfor %}

    </select>

    <p>
        <label for="anuncio_id">Anúncio:</label>
    </p>

    <select id="anuncio_id" name="anuncio_id" required>

        {% for anuncio in anuncios %}

        <option
            value="{{ anuncio.id }}"
            {% if anuncio.id == compra.anuncio_id %}selected{% endif %}
        >
            {{ anuncio.titulo }}
        </option>

        {% endfor %}

    </select>

    <p>
        <label for="quantidade">Quantidade:</label>
    </p>

    <p>
        <input
            type="number"
            id="quantidade"
            name="quantidade"
            min="1"
            value="{{ compra.quantidade }}"
            required
        >
    </p>

    <p>
        <label for="valor">Valor:</label>
    </p>

    <p>
        <input
            type="number"
            id="valor"
            name="valor"
            step="0.01"
            value="{{ compra.valor }}"
            required
        >
    </p>

    <p>
        <input type="submit" value="Salvar Alterações">
    </p>

</form>

<p>
    <a href="{{ url_for('compra') }}">
        Voltar para compras
    </a>
</p>

{% endblock %}
</body>
</html>
